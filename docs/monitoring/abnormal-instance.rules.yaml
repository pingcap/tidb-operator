groups:
  - name: tidb-operator-instance
    rules:
      - alert: TiDBOperatorInstanceNotReady
        expr: |
          max without (reason) (
            tidb_operator_abnormal_instance{condition="Ready",reason!~"Suspended|Suspending"}
          ) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Instance {{ $labels.namespace }}/{{ $labels.instance }} is not ready'
          description: 'Component {{ $labels.component }} in cluster {{ $labels.cluster }} has remained not ready for 10 minutes.'
      - alert: TiDBOperatorInstanceNotSynced
        expr: |
          max without (reason) (
            tidb_operator_abnormal_instance{condition="Synced"}
          ) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Instance {{ $labels.namespace }}/{{ $labels.instance }} is not synced'
          description: 'Component {{ $labels.component }} in cluster {{ $labels.cluster }} has failed to reconcile for 10 minutes.'
